version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: coach-pad-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - coach_pad_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: coach-pad-redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - coach_pad_redis_data:/data


volumes:
  coach_pad_pg_data:
  coach_pad_redis_data:

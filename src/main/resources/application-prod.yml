server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      keepalive-time: 0
      idle-timeout: 60000
      max-lifetime: 120000
      minimum-idle: 0
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.yaml

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: true

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900000
  refresh-expiration: 604800000

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}

logging:
  level:
    root: INFO
    com.coachpad: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

cookie:
  secure: true
  same-site: None